name: ShapeLex Release Gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Full release verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Verify tag, package, changelog, doctor, and MCP version parity
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          fi
          grep "## \[$PACKAGE_VERSION\]" CHANGELOG.md
          npm run doctor | grep "Version: $PACKAGE_VERSION"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | timeout 10s node ./bin/shapelex-mcp.js \
            | grep "\"version\":\"$PACKAGE_VERSION\""
      - run: npm run check
      - name: Nightly property and torture gates
        run: npm run test:v06:nightly
        env:
          SHAPELEX_TEST_PROFILE: "nightly"
          SHAPELEX_PROPERTY_RUNS: "10000"
          SHAPELEX_PROPERTY_SEED: "20260728"
          SHAPELEX_TORTURE: "1"
      - name: Safety-critical mutation gate
        run: npm run mutation:v06
        env:
          # Stryker runs from a copied workspace, so it must not inherit a
          # workspace-bound store created by earlier release checks.
          SHAPELEX_PERSIST: "0"
      - name: Upload focused mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shapelex-v06-mutation-focused
          path: coverage/v06/mutation.html
          if-no-files-found: warn
          retention-days: 14
      - run: npm audit --audit-level=moderate --cache ./.npm-cache
      - name: Inspect exact release tarball
        run: npm pack --dry-run --cache ./.npm-cache

  windows-persistence:
    name: Windows persistence and concurrency
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Eight-process transactional torture
        run: npm run test:v06:platform
        env:
          SHAPELEX_TEST_PROFILE: "nightly"
          SHAPELEX_TORTURE: "1"
          SHAPELEX_PROPERTY_RUNS: "250"
          SHAPELEX_PROPERTY_SEED: "20260728"

  macos-contract:
    name: macOS core and symlink contract
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck:v06
      - run: npm test
