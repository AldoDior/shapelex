name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke eval
        run: npm run smoke

      - name: End-to-end eval
        run: npm run e2e

      - name: Benchmark
        run: npm run benchmark

      - name: Audit
        run: npm audit --audit-level=moderate --cache ./.npm-cache

      - name: Package dry run
        run: npm pack --dry-run --cache ./.npm-cache
