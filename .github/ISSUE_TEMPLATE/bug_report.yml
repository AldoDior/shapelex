name: Bug report
description: Report a problem with ShapeLex
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `npm run doctor` or `shapelex-mcp --doctor` output.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and MCP client such as Codex, Claude Code, or Cursor.
